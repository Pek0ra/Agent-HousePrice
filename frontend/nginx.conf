server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    resolver 127.0.0.11 valid=10s ipv6=off;

    # Variables force runtime Docker DNS resolution after an upstream container
    # is recreated and receives a new IP address.
    set $python_agent http://python-agent:8000;
    set $java_backend http://java-backend:9900;

    location /api/agent/ {
        rewrite ^/api/agent/(.*)$ /api/v1/$1 break;
        proxy_pass $python_agent;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 60s;
        proxy_buffering off;
    }

    location /api/java/ {
        rewrite ^/api/java/(.*)$ /api/$1 break;
        proxy_pass $java_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    location = /health {
        access_log off;
        add_header Content-Type text/plain;
        return 200 'ok';
    }
}
