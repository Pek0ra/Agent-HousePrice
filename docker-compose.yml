name: agent-house-price

services:
  mysql:
    image: mysql:8.0
    container_name: agent-house-price-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_PASSWORD:?Set MYSQL_PASSWORD in .env}
      MYSQL_DATABASE: house_price
      AGENT_MYSQL_PASSWORD: ${AGENT_MYSQL_PASSWORD:-house_agent_change_me}
      AGENT_AUDIT_MYSQL_PASSWORD: ${AGENT_AUDIT_MYSQL_PASSWORD:-house_agent_audit_change_me}
      TZ: Asia/Shanghai
    ports:
      - "${MYSQL_PORT:-3306}:3306"
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_0900_ai_ci
    volumes:
      - mysql_data:/var/lib/mysql
      - ./infra/mysql/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test:
        - CMD-SHELL
        - 'MYSQL_PWD="$${MYSQL_ROOT_PASSWORD}" mysqladmin ping --protocol=tcp -h 127.0.0.1 -uroot --silent'
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  java-backend:
    build:
      context: ./backend-java
      dockerfile: Dockerfile
      args:
        MAVEN_PROFILE: ${JAVA_MAVEN_PROFILE:-local}
    image: agent-house-price-java-backend:${JAVA_MAVEN_PROFILE:-local}
    container_name: agent-house-price-java-backend
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-local}
      BIG_DATA_ENABLED: ${BIG_DATA_ENABLED:-false}
      MYSQL_URL: jdbc:mysql://mysql:3306/house_price?useUnicode=true&characterEncoding=UTF-8&connectionCollation=utf8mb4_0900_ai_ci&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
      MYSQL_USERNAME: ${MYSQL_USERNAME:-root}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?Set MYSQL_PASSWORD in .env}
      AGENT_SERVICE_URL: http://python-agent:8000
      HIVE_URL: ${HIVE_URL:-jdbc:hive2://hiveserver2:10000/mydb}
      HIVE_USERNAME: ${HIVE_USERNAME:-hive}
      HIVE_PASSWORD: ${HIVE_PASSWORD:-}
      HDFS_WEB_URL: ${HDFS_WEB_URL:-http://namenode:9870}
      HDFS_USER: ${HDFS_USER:-hive}
      HDFS_BASE_PATH: ${HDFS_BASE_PATH:-/data/house/raw}
      JAVA_TOOL_OPTIONS: ${JAVA_TOOL_OPTIONS:--XX:MaxRAMPercentage=75.0 -Dfile.encoding=UTF-8}
      TZ: Asia/Shanghai
    ports:
      - "${JAVA_PORT:-9900}:9900"
    volumes:
      - java_data:/app/data
    healthcheck:
      test:
        - CMD-SHELL
        - 'curl --fail --silent --show-error http://127.0.0.1:9900/actuator/health | grep -q ''"status":"UP"'''
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 40s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  python-agent:
    build:
      context: ./agent-service
      dockerfile: Dockerfile
    image: agent-house-price-python-agent:local
    container_name: agent-house-price-python-agent
    restart: unless-stopped
    depends_on:
      mysql-agent-security:
        condition: service_completed_successfully
    environment:
      APP_ENV: ${AGENT_APP_ENV:-local}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-4.1-mini}
      OPENAI_BASE_URL: ${OPENAI_BASE_URL:-}
      CORS_ORIGINS: ${AGENT_CORS_ORIGINS:-http://localhost:9900,http://127.0.0.1:9900}
      JAVA_BACKEND_URL: http://java-backend:9900
      MYSQL_HOST: mysql
      MYSQL_PORT: 3306
      MYSQL_DATABASE: house_price
      MYSQL_USERNAME: house_agent_ro
      MYSQL_PASSWORD: ${AGENT_MYSQL_PASSWORD:-house_agent_change_me}
      AUDIT_MYSQL_USERNAME: house_agent_audit
      AUDIT_MYSQL_PASSWORD: ${AGENT_AUDIT_MYSQL_PASSWORD:-house_agent_audit_change_me}
      SQL_MAX_ROWS: ${SQL_MAX_ROWS:-100}
      SQL_EXECUTION_TIMEOUT_MS: ${SQL_EXECUTION_TIMEOUT_MS:-5000}
      SQL_MAX_REPAIR_ATTEMPTS: ${SQL_MAX_REPAIR_ATTEMPTS:-1}
      BIG_DATA_ENABLED: ${BIG_DATA_ENABLED:-false}
      HIVE_HOST: ${HIVE_HOST:-hiveserver2}
      HIVE_PORT: ${HIVE_INTERNAL_PORT:-10000}
      HIVE_DATABASE: ${HIVE_DATABASE:-mydb}
      HIVE_USERNAME: ${HIVE_USERNAME:-hive}
      HIVE_AUTH: ${HIVE_AUTH:-NONE}
      TZ: Asia/Shanghai
    ports:
      - "${AGENT_PORT:-8000}:8000"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)"
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    image: agent-house-price-frontend:local
    container_name: agent-house-price-frontend
    restart: unless-stopped
    depends_on:
      java-backend:
        condition: service_healthy
      python-agent:
        condition: service_healthy
    ports:
      - "${FRONTEND_PORT:-80}:80"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://127.0.0.1/health"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  mysql-agent-security:
    image: mysql:8.0
    container_name: agent-house-price-mysql-agent-security
    restart: "no"
    depends_on:
      mysql:
        condition: service_healthy
      java-backend:
        condition: service_healthy
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_PASSWORD:?Set MYSQL_PASSWORD in .env}
      AGENT_MYSQL_PASSWORD: ${AGENT_MYSQL_PASSWORD:-house_agent_change_me}
      AGENT_AUDIT_MYSQL_PASSWORD: ${AGENT_AUDIT_MYSQL_PASSWORD:-house_agent_audit_change_me}
    volumes:
      - ./infra/mysql/security/configure-agent-security.sh:/security/configure-agent-security.sh:ro
    entrypoint:
      - bash
      - /security/configure-agent-security.sh

  namenode:
    profiles: ["bigdata"]
    image: apache/hadoop:3.3.6
    container_name: agent-house-price-namenode
    hostname: namenode
    restart: unless-stopped
    user: root
    command:
      - bash
      - -c
      - >-
        if [ ! -f /data/name/current/VERSION ]; then
          hdfs namenode -format -force -nonInteractive;
        fi &&
        exec hdfs namenode
    ports:
      - "${HDFS_NAMENODE_RPC_PORT:-8020}:8020"
      - "${HDFS_NAMENODE_WEB_PORT:-9870}:9870"
    volumes:
      - hdfs_namenode:/data/name
      - ./infra/bigdata/hadoop/core-site.xml:/opt/hadoop/etc/hadoop/core-site.xml:ro
      - ./infra/bigdata/hadoop/hdfs-site.xml:/opt/hadoop/etc/hadoop/hdfs-site.xml:ro
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'echo > /dev/tcp/127.0.0.1/9870'"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 30s

  datanode:
    profiles: ["bigdata"]
    image: apache/hadoop:3.3.6
    container_name: agent-house-price-datanode
    hostname: datanode
    restart: unless-stopped
    user: root
    command: ["hdfs", "datanode"]
    depends_on:
      namenode:
        condition: service_healthy
    ports:
      - "${HDFS_DATANODE_WEB_PORT:-9864}:9864"
    volumes:
      - hdfs_datanode:/data/data
      - ./infra/bigdata/hadoop/core-site.xml:/opt/hadoop/etc/hadoop/core-site.xml:ro
      - ./infra/bigdata/hadoop/hdfs-site.xml:/opt/hadoop/etc/hadoop/hdfs-site.xml:ro
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'echo > /dev/tcp/127.0.0.1/9864'"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 30s

  hdfs-init:
    profiles: ["bigdata"]
    image: apache/hadoop:3.3.6
    container_name: agent-house-price-hdfs-init
    restart: "no"
    user: root
    depends_on:
      namenode:
        condition: service_healthy
      datanode:
        condition: service_healthy
    volumes:
      - ./infra/bigdata/hadoop/core-site.xml:/opt/hadoop/etc/hadoop/core-site.xml:ro
      - ./infra/bigdata/hadoop/hdfs-site.xml:/opt/hadoop/etc/hadoop/hdfs-site.xml:ro
    command:
      - bash
      - -c
      - >-
        hdfs dfs -mkdir -p /tmp /user/hive/warehouse /data/house/raw &&
        hdfs dfs -chmod 1777 /tmp &&
        hdfs dfs -chmod -R 777 /user/hive/warehouse /data/house

  hive-metastore:
    profiles: ["bigdata"]
    image: apache/hive:3.1.3
    container_name: agent-house-price-hive-metastore
    hostname: hive-metastore
    restart: unless-stopped
    depends_on:
      hdfs-init:
        condition: service_completed_successfully
    environment:
      SERVICE_NAME: metastore
      DB_DRIVER: derby
      HIVE_CUSTOM_CONF_DIR: /hive_custom_conf
      SERVICE_OPTS: >-
        -Xmx768m
        -Dfs.defaultFS=hdfs://namenode:8020
        -Dhive.metastore.warehouse.dir=hdfs://namenode:8020/user/hive/warehouse
    ports:
      - "${HIVE_METASTORE_PORT:-9083}:9083"
    volumes:
      - hive_metastore_data:/opt/hive/data
      - ./infra/bigdata/hive/conf:/hive_custom_conf:ro
      - ./infra/bigdata/hadoop/core-site.xml:/opt/hadoop/etc/hadoop/core-site.xml:ro
      - ./infra/bigdata/hadoop/hdfs-site.xml:/opt/hadoop/etc/hadoop/hdfs-site.xml:ro
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'echo > /dev/tcp/127.0.0.1/9083'"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 60s

  hiveserver2:
    profiles: ["bigdata"]
    image: apache/hive:3.1.3
    container_name: agent-house-price-hiveserver2
    hostname: hiveserver2
    restart: unless-stopped
    depends_on:
      hive-metastore:
        condition: service_healthy
      hdfs-init:
        condition: service_completed_successfully
    environment:
      SERVICE_NAME: hiveserver2
      IS_RESUME: "true"
      HIVE_CUSTOM_CONF_DIR: /hive_custom_conf
      SERVICE_OPTS: >-
        -Xmx1024m
        -Dfs.defaultFS=hdfs://namenode:8020
        -Dhive.metastore.uris=thrift://hive-metastore:9083
        -Dhive.server2.enable.doAs=false
    entrypoint:
      - bash
      - -c
      - mkdir -p /tmp/hive /tmp/hive-local && chmod 1777 /tmp/hive /tmp/hive-local && exec /entrypoint.sh
    ports:
      - "${HIVE_SERVER2_PORT:-10001}:10000"
      - "${HIVE_SERVER2_WEB_PORT:-10002}:10002"
    volumes:
      - ./infra/bigdata/hive/conf:/hive_custom_conf:ro
      - ./infra/bigdata/hadoop/core-site.xml:/opt/hadoop/etc/hadoop/core-site.xml:ro
      - ./infra/bigdata/hadoop/hdfs-site.xml:/opt/hadoop/etc/hadoop/hdfs-site.xml:ro
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'echo > /dev/tcp/127.0.0.1/10000'"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 60s

  hive-init:
    profiles: ["bigdata"]
    image: apache/hive:3.1.3
    container_name: agent-house-price-hive-init
    restart: "no"
    depends_on:
      hiveserver2:
        condition: service_healthy
    volumes:
      - ./infra/bigdata/hive/init:/hive-init:ro
      - ./infra/bigdata/hive/conf:/hive_custom_conf:ro
      - ./infra/bigdata/hadoop/core-site.xml:/opt/hadoop/etc/hadoop/core-site.xml:ro
      - ./infra/bigdata/hadoop/hdfs-site.xml:/opt/hadoop/etc/hadoop/hdfs-site.xml:ro
    entrypoint:
      - bash
      - -c
      - beeline -u 'jdbc:hive2://hiveserver2:10000/default' -n hive -f /hive-init/01_init_hive.sql

volumes:
  mysql_data:
    name: agent-house-price-mysql-data
  java_data:
    name: agent-house-price-java-data
  hdfs_namenode:
    name: agent-house-price-hdfs-namenode
  hdfs_datanode:
    name: agent-house-price-hdfs-datanode
  hive_metastore_data:
    name: agent-house-price-hive-metastore

networks:
  default:
    name: agent-house-price-network
