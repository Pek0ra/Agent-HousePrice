spring.application.name=prjspringbootzufanghive
spring.profiles.default=local
server.port=9900
server.servlet.encoding.charset=UTF-8
server.servlet.encoding.enabled=true
server.servlet.encoding.force=true

# MySQL: online house management and transactions.
spring.datasource.mysql.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.mysql.url=${MYSQL_URL:jdbc:mysql://localhost:3306/house_price?useUnicode=true&characterEncoding=UTF-8&connectionCollation=utf8mb4_0900_ai_ci&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true}
spring.datasource.mysql.username=${MYSQL_USERNAME:}
spring.datasource.mysql.password=${MYSQL_PASSWORD:}
spring.datasource.mysql.hikari.maximum-pool-size=${MYSQL_POOL_MAX_SIZE:10}
spring.datasource.mysql.hikari.minimum-idle=${MYSQL_POOL_MIN_IDLE:2}
spring.datasource.mysql.hikari.connection-timeout=${MYSQL_CONNECTION_TIMEOUT_MS:30000}

# Flyway owns MySQL schema changes. Baseline version 0 adopts databases created
# before Flyway was introduced, then applies V1 and later migrations safely.
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=0
spring.flyway.validate-on-migrate=true

# Only health and info are public management endpoints.
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=never

# Hive: analytical queries and controlled import loading.
spring.datasource.hive.driver-class-name=org.apache.hive.jdbc.HiveDriver
spring.datasource.hive.url=${HIVE_URL:jdbc:hive2://localhost:10000/mydb}
spring.datasource.hive.username=${HIVE_USERNAME:}
spring.datasource.hive.password=${HIVE_PASSWORD:}
spring.datasource.hive.hikari.maximum-pool-size=${HIVE_POOL_MAX_SIZE:5}
spring.datasource.hive.hikari.minimum-idle=${HIVE_POOL_MIN_IDLE:0}
spring.datasource.hive.hikari.connection-timeout=${HIVE_CONNECTION_TIMEOUT_MS:30000}

# CSV import and WebHDFS. Never put cluster credentials in this file.
spring.servlet.multipart.max-file-size=${IMPORT_MAX_FILE_SIZE:50MB}
spring.servlet.multipart.max-request-size=${IMPORT_MAX_FILE_SIZE:50MB}
app.import.max-rows=${IMPORT_MAX_ROWS:500000}
app.import.max-file-size-bytes=${IMPORT_MAX_FILE_SIZE_BYTES:52428800}
app.import.max-retries=${IMPORT_MAX_RETRIES:3}
app.import.staging-path=${IMPORT_STAGING_PATH:./data/import-staging}
app.import.unit-price-tolerance-percent=${IMPORT_UNIT_PRICE_TOLERANCE_PERCENT:1.0}
app.import.mysql.url=${IMPORT_MYSQL_URL:${spring.datasource.mysql.url}}
app.import.mysql.username=${IMPORT_MYSQL_USERNAME:${spring.datasource.mysql.username}}
app.import.mysql.password=${IMPORT_MYSQL_PASSWORD:${spring.datasource.mysql.password}}
app.import.mysql.hikari.maximum-pool-size=${IMPORT_MYSQL_POOL_MAX_SIZE:4}
app.import.mysql.hikari.minimum-idle=0
app.hdfs.web-url=${HDFS_WEB_URL:http://localhost:9870}
app.hdfs.user=${HDFS_USER:}
app.hdfs.base-path=${HDFS_BASE_PATH:/data/house/normalized}
app.hdfs.connect-timeout-seconds=${HDFS_CONNECT_TIMEOUT_SECONDS:10}
app.hdfs.request-timeout-seconds=${HDFS_REQUEST_TIMEOUT_SECONDS:300}
app.hive.raw-table=${HIVE_RAW_TABLE:house_info_raw}
app.hive.detail-table=${HIVE_DETAIL_TABLE:house_info_detail}
app.hive.analysis-table=${HIVE_ANALYSIS_TABLE:v_agent_house_info_analysis}
app.hive.quality-table=${HIVE_QUALITY_TABLE:v_agent_house_data_quality_summary}
app.hive.query-timeout-seconds=${HIVE_QUERY_TIMEOUT_SECONDS:300}
