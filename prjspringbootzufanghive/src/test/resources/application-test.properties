spring.datasource.mysql.driver-class-name=org.h2.Driver
spring.datasource.mysql.url=jdbc:h2:mem:house_price_test;MODE=MySQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1
spring.datasource.mysql.username=sa
spring.datasource.mysql.password=
spring.datasource.mysql.hikari.maximum-pool-size=3
spring.datasource.mysql.hikari.minimum-idle=0
spring.flyway.enabled=false

spring.datasource.hive.driver-class-name=org.h2.Driver
spring.datasource.hive.url=jdbc:h2:mem:hive_test;MODE=MySQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1
spring.datasource.hive.username=sa
spring.datasource.hive.password=
spring.datasource.hive.hikari.minimum-idle=0
app.import.staging-path=target/test-import-staging
app.import.max-file-size-bytes=1024
app.big-data.enabled=true
